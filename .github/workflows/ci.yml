  # One tag per merge to master: v<MajorMinor>.<N>, the same number the build embeds
  # (Directory.Build.targets). Runs only after build + tests + publish and the repo checks succeeded. No release is created
  # here: a human runs the Release workflow (Actions > Release > Run workflow) for the tag they want.
  #
  # The condition lives on each STEP, not on the job, so a PR run reports this job success (its steps
  # individually skipped) instead of the whole job showing skipped in the PR checks list -- purely a
  # display choice, the job never did anything on a PR either way.
  tag-version:
    needs: [build-test-publish, repo-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create version tags (current + any missed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          mm=$(sed -n 's:.*<PhotoReviewVersionMajorMinor>\(.*\)</PhotoReviewVersionMajorMinor>.*:\1:p' Directory.Build.targets)
          anchor=$(sed -n 's:.*<PhotoReviewVersionAnchorTag>\(.*\)</PhotoReviewVersionAnchorTag>.*:\1:p' Directory.Build.targets)
          # Quick successive merges cancel pending master runs (GitHub keeps one pending run per
          # concurrency group), so some versions never got a tag. Backfill every first-parent commit
          # from the first auto-created tag onward; older versions (before tagging existed) stay untagged.
          first=$(git tag -l "v${mm}.*" | sed "s/^v${mm}\.//" | grep -E '^[0-9]+$' | awk '$1 > 0' | sort -n | head -1 || true)
          n=0; created=()
          for c in $(git rev-list --first-parent --reverse "${anchor}..HEAD"); do
            n=$((n + 1))
            if [ -n "${first}" ] && [ "${n}" -lt "${first}" ]; then continue; fi
            if [ -z "${first}" ] && [ "${c}" != "${GITHUB_SHA}" ]; then continue; fi
            tag="v${mm}.${n}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then continue; fi
            note=""; [ "${c}" != "${GITHUB_SHA}" ] && note=" (backfilled; that commit's own CI run was cancelled)"
            if [ ${#created[@]} -eq 0 ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            fi
            git tag -a "${tag}" -m "PhotoReview ${mm}.${n}${note}" "${c}"
            created+=("${tag}")
            echo "Tagged ${tag} at ${c}${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          done
          if [ ${#created[@]} -eq 0 ]; then
            echo "No missing tags"
            exit 0
          fi
          # Push each tag individually: GitHub's default GITHUB_TOKEN is permanently, platform-level
          # blocked from creating/updating any ref whose target commit touches .github/workflows/ (anti
          # workflow-permission-escalation; not something `permissions:` can grant). A historical tag such
          # as v2.0.179 sits on such a commit and will NEVER push. A single batched
          # `git push origin "${created[@]}"` fails atomically on that one ref and was reporting this job
          # red on every run even when THIS run's own tag pushed fine. Looping means one permanently-stuck
          # tag can no longer block the rest.
          failures=0
          for tag in "${created[@]}"; do
            if push_err=$(git push origin "${tag}" 2>&1); then
              echo "Pushed ${tag}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              continue
            fi
            echo "${push_err}" >&2
            target=$(git rev-list -n 1 "${tag}")
            workflow_commit=0
            if [ -n "$(git diff-tree --no-commit-id --name-only -r "${target}" -- .github/workflows 2>/dev/null)" ]; then
              workflow_commit=1
            fi
            # Primary signal: GitHub's actual rejection text for this restriction. Backstop: even if the
            # wording changes, a push failure for a tag whose target commit touches .github/workflows/ is
            # this same known-impossible case, not a new problem.
            if printf '%s' "${push_err}" | grep -qiE "workflow|refusing to allow" || [ "${workflow_commit}" -eq 1 ]; then
              {
                echo "::warning::Skipped push of ${tag} (target ${target} modifies .github/workflows/): GitHub's GITHUB_TOKEN is permanently blocked from creating/updating a ref pointing at a workflow-file change (anti-escalation, not a grantable permission). Expected and cannot be fixed; harmless, will be retried (and skipped again) on future runs."
                echo "- Skipped pushing \`${tag}\` (target \`${target}\` touches \`.github/workflows/\`): permanently blocked by GitHub's workflow-permission restriction on \`GITHUB_TOKEN\`. Expected, not a real failure." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              }
            else
              echo "::error::Failed to push ${tag} for a reason other than the known workflow-permission restriction."
              failures=$((failures + 1))
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            echo "${failures} tag push(es) failed for an unexpected reason; see the errors above." >&2
            exit 1
          fi
