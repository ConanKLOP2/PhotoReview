name: CI

on:
  pull_request:
    branches:
      - master
      - refactor/integration
  push:
    branches:
      - master
      - refactor/integration
      - refactor/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # No dotnet-version input: reads the pinned SDK version from global.json
        # directly, so the workflow can't drift from what the repo actually pins.

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      - name: Build Release
        run: dotnet build PhotoReview.slnx -c Release --no-restore

      # CI runs HotPath tests only (fast, mocked deps)
      # Stress/Native/Slow/Integration tests run locally only (optional via -Stress, -Native, -Slow, -Integration)
      # NOTE: Filter below is verified to match tools/verify-all.ps1 (TS09 verification)
      # Parallel execution via Start-Job was tried and reverted: windows-latest runners
      # only have 2 vCPUs, so 5 concurrent dotnet test processes just contended for CPU
      # instead of running faster (measured 28s parallel vs 26s sequential), while adding
      # real fragility (job working-directory bug, unreliable exit-code propagation).
      - name: Run Architecture tests (HotPath)
        run: dotnet test tests/PhotoReview.Architecture.Tests/PhotoReview.Architecture.Tests.csproj -c Release --no-build --filter "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run Core tests (HotPath)
        run: dotnet test tests/PhotoReview.Core.Tests/PhotoReview.Core.Tests.csproj -c Release --no-build --filter "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run Imaging tests (HotPath)
        run: dotnet test tests/PhotoReview.Imaging.Tests/PhotoReview.Imaging.Tests.csproj -c Release --no-build --filter "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run Integration tests (HotPath)
        run: dotnet test tests/PhotoReview.Integration.Tests/PhotoReview.Integration.Tests.csproj -c Release --no-build --filter "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run App tests (HotPath)
        run: dotnet test tests/PhotoReview.App.Tests/PhotoReview.App.Tests.csproj -c Release --no-build --filter "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Publish Release
        # --no-restore: the App project was already restored as part of the
        # whole-solution restore above; dotnet publish restores again by
        # default, which is redundant work on an unchanged dependency graph.
        run: dotnet publish src/PhotoReview.App/PhotoReview.App.csproj -c Release --no-restore --self-contained false -o src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Verify Release
        shell: powershell
        run: ./tools/verify-release.ps1 -ReleaseDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publish
          path: src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
