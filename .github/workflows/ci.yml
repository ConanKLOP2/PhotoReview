        # directly, so the workflow can't drift from what the repo actually pins.

      # Every job restores the WHOLE solution (not only its own projects) so all jobs produce the same package set and
      # whichever job saves the cache entry first saves a complete one.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # turbojpeg.dll is the only native binary that is DOWNLOADED (LibRaw is committed): nuget.org was sometimes 100+ s slow.
      # tools/fetch-native.ps1 still verifies the pinned SHA-256 of whatever the cache restored (a mismatch re-downloads).
      - name: Cache native binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/x64/turbojpeg.dll
          key: ${{ runner.os }}-turbojpeg-${{ hashFiles('native/turbojpeg.sha256', 'tools/fetch-native.ps1') }}

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Fetch LibRaw native binary
        shell: powershell
        run: ./tools/fetch-libraw.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      # Builds only the test projects of this job (and what they reference), not the whole solution, with ONE `dotnet build` of a
      # solution filter (tools/ci/<job>.slnf): shared dependencies compile once and independent projects build in parallel.
      # -p:RunAnalyzers=false: the diagnostic analyzers (CA*, VSTHRD*, code style) were measured at about half of this build; they do not
      # change the compiled code (source generators still run), and the `compile-gate` job compiles the WHOLE solution with every
      # analyzer on and warnings as errors, so no diagnostic is lost. Do not add RunAnalyzers=false anywhere else.
      # shell: powershell (not pwsh) on purpose: LibRaw's build step runs `powershell fetch-libraw.ps1`, which fails to find
      # Get-FileHash when the parent is PowerShell 7 (inherited PSModulePath).
      - name: Build test projects (Release)
        shell: powershell
        run: dotnet build tools/ci/test-app.slnf -c Release --no-restore -p:RunAnalyzers=false

      - name: Run Architecture tests (HotPath)
        shell: pwsh
        run: dotnet test tests/PhotoReview.Architecture.Tests/PhotoReview.Architecture.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run App tests (HotPath)
        shell: pwsh
        run: dotnet test tests/PhotoReview.App.Tests/PhotoReview.App.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run Shell.WpfBridge tests (HotPath)
        shell: pwsh
        run: dotnet test tests/PhotoReview.Shell.WpfBridge.Tests/PhotoReview.Shell.WpfBridge.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      # Q-R3: the tests tagged Category=Integration always run in CI, even when their class also carries
      # another exclusion trait (Slow), so a filter change can never silently drop them again. Only the
      # Integration+Slow tests are missing from the main filter, so only those run here (no double run, R2-A-12),
      # exactly once per test project (the one job that lists the project below).
      - name: Run Integration-category tests that the main filter skips (Slow)
        shell: pwsh
        run: |
          foreach ($project in 'PhotoReview.Architecture.Tests', 'PhotoReview.App.Tests', 'PhotoReview.Shell.WpfBridge.Tests') {
            dotnet test "tests/$project/$project.csproj" -c Release --no-build --filter "Category=Integration&Category=Slow&Category!=Manual&Category!=Native" --logger "trx;LogFileName=$project.integration-slow.trx" --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { throw "Integration+Slow tests failed in $project (exit $LASTEXITCODE)" }
          }

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-app
          path: TestResults

  # Shell.Tests shard A: namespace PhotoReview.Shell.Tests.Dialogs.SettingsUi (about 75 s of tests). Shard B (every other
  # Shell.Tests test, plus Shell.Integration.Tests) is test-shell: the two filters are exact complements (FullyQualifiedName~ /
  # !~ the same namespace) so no test is lost or run twice; the Architecture test CI-PARALLEL checks the pair.
  test-shell-settings:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # The workspace is on D: (faster than the C: profile drive): packages are restored/extracted there too.
      NUGET_PACKAGES: D:\nuget-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Directory.Build.targets derives the version from
          # `git rev-list --count --first-parent v2.0.0..HEAD`.
          fetch-depth: 0

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
