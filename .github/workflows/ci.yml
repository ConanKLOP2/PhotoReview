name: CI

on:
  pull_request:
    branches:
      - master
      - refactor/integration
  push:
    branches:
      - master
      - refactor/integration
      - refactor/**
  workflow_dispatch:

# Least privilege: build/test/publish only reads; tag-version below overrides with contents: write.
permissions:
  contents: read

env:
  # Single source of truth for the test gate; must equal the filter line in AGENTS.md > Tests.
  TEST_FILTER: "Category!=Manual&Category!=Native&Category!=Slow"

concurrency:
  group: ${{ github.ref }}
  # Never cancel master runs: each merge is a version (2.0.N) that must be built and tagged.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Docs/i18n gates need no .NET, no build and no git history beyond `git ls-files`, so they run in
  # parallel with build-test-publish instead of lengthening it. Same gates as tools/verify-all.ps1.
  repo-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L10: strict JSON validator self-test (comments/trailing commas/duplicate keys) before trusting it
      # against real files.
      - name: Check translation catalogs (self-test)
        shell: powershell
        run: ./tools/i18n-check.ps1 -SelfTest

      # The curated RAW corpus manifest must keep its exact CC0 1.0 license assertion.
      - name: Check RAW sample manifest guard (self-test)
        shell: powershell
        run: ./tools/fetch-raw-samples.ps1 -SelfTest

      # L10: translation catalogs are valid (JSON, _meta.code, no unknown keys/placeholders); prints completeness.
      - name: Check translation catalogs
        shell: powershell
        run: ./tools/i18n-check.ps1

      # Same documentation gates as tools/verify-all.ps1: T0/T1 size budget, and no broken links outside docs/archive.
      - name: Check documentation budget
        shell: powershell
        run: ./tools/docs-budget.ps1 -Check

      - name: Check documentation links
        shell: powershell
        run: ./tools/check-doc-links.ps1

      # Fails if docs/refactoring/OPEN-DECISIONS.md's generated Decided table doesn't match what
      # tools/generate-open-decisions.ps1 produces right now (hand-edited row, or a new
      # decisions/*.md file added/changed without re-running the generator).
      - name: Check OPEN-DECISIONS generated table
        shell: powershell
        run: ./tools/check-open-decisions.ps1

  # Decides whether the build/test/publish jobs are needed. Only a pull_request whose changed files are ALL under docs/
  # (or README.md/CLAUDE.md/task_on_progress.md) skips them; push, workflow_dispatch and anything else runs everything,
  # so master is always fully built, tested, published and tagged. AGENTS.md is deliberately NOT listed: an
  # Architecture test reads it (default test filter drift).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect docs-only pull request
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          code=true
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            # On pull_request HEAD is the merge commit: HEAD^1 is the base tip, so this is exactly the PR's changes.
            files=$(git diff --name-only 'HEAD^1' HEAD)
            if [ -n "${files}" ] && ! printf '%s\n' "${files}" | grep -qvE '^(docs/|README\.md$|CLAUDE\.md$|task_on_progress\.md$)'; then
              code=false
            fi
            printf 'Changed files:\n%s\n' "${files}"
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "Build/test/publish needed: ${code}" >> "${GITHUB_STEP_SUMMARY}"

  # Release build of the two published executables (warnings are errors), then the release publish + verify + artifact.
  # Runs in parallel with the test jobs below; nothing here depends on tests (publish-release.ps1 only needs the build).
  build-publish:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # The workspace is on D: (faster than the C: profile drive): packages are restored/extracted there too.
      NUGET_PACKAGES: D:\nuget-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Directory.Build.targets derives the version from
          # `git rev-list --count --first-parent v2.0.0..HEAD`.
          fetch-depth: 0

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # No dotnet-version input: reads the pinned SDK version from global.json
        # directly, so the workflow can't drift from what the repo actually pins.

      # Every job restores the WHOLE solution (not only its own projects) so all jobs produce the same package set and
      # whichever job saves the cache entry first saves a complete one.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # turbojpeg.dll is the only native binary that is DOWNLOADED (LibRaw is committed): nuget.org was sometimes 100+ s slow.
      # tools/fetch-native.ps1 still verifies the pinned SHA-256 of whatever the cache restored (a mismatch re-downloads).
      - name: Cache native binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/x64/turbojpeg.dll
          key: ${{ runner.os }}-turbojpeg-${{ hashFiles('native/turbojpeg.sha256', 'tools/fetch-native.ps1') }}

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Fetch LibRaw native binary
        shell: powershell
        run: ./tools/fetch-libraw.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      # Only the two executables and their dependency closure (tools/ci/publish.slnf): that is exactly what is published (analyzers
      # on, warnings are errors). The rest of the solution is compiled by compile-gate.
      - name: Build Release
        shell: powershell
        run: dotnet build tools/ci/publish.slnf -c Release --no-restore

      - name: Show version
        shell: powershell
        run: |
          $v = (Get-Item 'src/PhotoReview.App/bin/Release/net10.0-windows/PhotoReview.App.dll').VersionInfo.ProductVersion
          Write-Host "PhotoReview $v"
          # R2-F-18: a build without git history is versioned 2.0.0-nogit; never let that reach the tag/artifact steps.
          if ($v -match '-nogit' -or $v -notmatch '\+[0-9a-fA-F]+') { Write-Error "Build has no git commit identity: $v"; exit 1 }
          "PhotoReview **$v**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish Release
        # RELEASE-SHELL-ONLY: the folder holds ONE product, PhotoReview.exe (Win32 shell), R2R, framework-dependent; no WPF app
        # (the script has an opt-in switch for local WPF builds). -NoRestore: the project was already restored as part of the whole-solution restore above;
        # the publish restores again by default, which is redundant work on an unchanged dependency graph.
        shell: powershell
        run: ./tools/publish-release.ps1 -NoRestore -OutputDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Verify Release
        shell: powershell
        # -Smoke also starts the published PhotoReview.exe --smoke (create + show the Win32 window, exit 0).
        run: ./tools/verify-release.ps1 -Smoke -ReleaseDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Upload publish artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-publish
          path: src/PhotoReview.App/bin/Release/net10.0-windows/publish

  # The compile gate: the WHOLE solution (src, tests, tools) in Release with every analyzer on and warnings as errors, exactly
  # what build-publish compiled before CI-OPTIMIZE-ROUND2. The test-* jobs skip the analyzers (RunAnalyzers=false) to save about half
  # of their build time; this job is why that costs no diagnostic. Runs beside them, so it is not on the critical path.
  compile-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # The workspace is on D: (faster than the C: profile drive): packages are restored/extracted there too.
      NUGET_PACKAGES: D:\nuget-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Directory.Build.targets derives the version from
          # `git rev-list --count --first-parent v2.0.0..HEAD`.
          fetch-depth: 0

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # No dotnet-version input: reads the pinned SDK version from global.json
        # directly, so the workflow can't drift from what the repo actually pins.

      # Every job restores the WHOLE solution (not only its own projects) so all jobs produce the same package set and
      # whichever job saves the cache entry first saves a complete one.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # turbojpeg.dll is the only native binary that is DOWNLOADED (LibRaw is committed): nuget.org was sometimes 100+ s slow.
      # tools/fetch-native.ps1 still verifies the pinned SHA-256 of whatever the cache restored (a mismatch re-downloads).
      - name: Cache native binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/x64/turbojpeg.dll
          key: ${{ runner.os }}-turbojpeg-${{ hashFiles('native/turbojpeg.sha256', 'tools/fetch-native.ps1') }}

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Fetch LibRaw native binary
        shell: powershell
        run: ./tools/fetch-libraw.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      - name: Build solution (Release, analyzers on, warnings are errors)
        shell: powershell
        run: dotnet build PhotoReview.slnx -c Release --no-restore

  # CI runs the HotPath tests plus the Category=Integration tests (fast, mocked deps, no real Recycle Bin); Native/Slow/Manual
  # run locally only (verify-all.ps1 -Native/-Slow). TEST_FILTER (workflow env) is verified to match tools/verify-all.ps1
  # and AGENTS.md > Tests. Tests used to run one after another in one job (~500 s). windows-latest has only 2 vCPUs, so
  # splitting into processes on one runner did not help (measured, reverted); splitting across RUNNERS does: six test jobs
  # (CI-OPTIMIZE-ROUND2), balanced by measured wall time, each building only its own test projects through one solution
  # filter. Every test project is owned by exactly one job (Shell.Tests by two complementary namespace shards).

  # Core + Imaging (about 80 s of tests). Light build: no WPF application, no shell (net10.0 / Imaging.Wpf only).
  test-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # The workspace is on D: (faster than the C: profile drive): packages are restored/extracted there too.
      NUGET_PACKAGES: D:\nuget-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Directory.Build.targets derives the version from
          # `git rev-list --count --first-parent v2.0.0..HEAD`.
          fetch-depth: 0

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        # No dotnet-version input: reads the pinned SDK version from global.json
        # directly, so the workflow can't drift from what the repo actually pins.

      # Every job restores the WHOLE solution (not only its own projects) so all jobs produce the same package set and
      # whichever job saves the cache entry first saves a complete one.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      # turbojpeg.dll is the only native binary that is DOWNLOADED (LibRaw is committed): nuget.org was sometimes 100+ s slow.
      # tools/fetch-native.ps1 still verifies the pinned SHA-256 of whatever the cache restored (a mismatch re-downloads).
      - name: Cache native binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/x64/turbojpeg.dll
          key: ${{ runner.os }}-turbojpeg-${{ hashFiles('native/turbojpeg.sha256', 'tools/fetch-native.ps1') }}

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Fetch LibRaw native binary
        shell: powershell
        run: ./tools/fetch-libraw.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      # Builds only the test projects of this job (and what they reference), not the whole solution, with ONE `dotnet build` of a
      # solution filter (tools/ci/<job>.slnf): shared dependencies compile once and independent projects build in parallel.
      # -p:RunAnalyzers=false: the diagnostic analyzers (CA*, VSTHRD*, code style) were measured at about half of this build; they do not
      # change the compiled code (source generators still run), and the `compile-gate` job compiles the WHOLE solution with every
      # analyzer on and warnings as errors, so no diagnostic is lost. Do not add RunAnalyzers=false anywhere else.
      # shell: powershell (not pwsh) on purpose: LibRaw's build step runs `powershell fetch-libraw.ps1`, which fails to find
      # Get-FileHash when the parent is PowerShell 7 (inherited PSModulePath).
      - name: Build test projects (Release)
        shell: powershell
        run: dotnet build tools/ci/test-core.slnf -c Release --no-restore -p:RunAnalyzers=false

      - name: Run Core tests (HotPath)
        shell: pwsh
        run: dotnet test tests/PhotoReview.Core.Tests/PhotoReview.Core.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      - name: Run Imaging tests (HotPath)
        shell: pwsh
        run: dotnet test tests/PhotoReview.Imaging.Tests/PhotoReview.Imaging.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --logger trx --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none

      # Q-R3: the tests tagged Category=Integration always run in CI, even when their class also carries
      # another exclusion trait (Slow), so a filter change can never silently drop them again. Only the
      # Integration+Slow tests are missing from the main filter, so only those run here (no double run, R2-A-12),
      # exactly once per test project (the one job that lists the project below).
      - name: Run Integration-category tests that the main filter skips (Slow)
        shell: pwsh
        run: |
          foreach ($project in 'PhotoReview.Core.Tests', 'PhotoReview.Imaging.Tests') {
            dotnet test "tests/$project/$project.csproj" -c Release --no-build --filter "Category=Integration&Category=Slow&Category!=Manual&Category!=Native" --logger "trx;LogFileName=$project.integration-slow.trx" --results-directory TestResults --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { throw "Integration+Slow tests failed in $project (exit $LASTEXITCODE)" }
          }

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-core
          path: TestResults

  # Architecture + App + Shell.WpfBridge (about 55 s of tests). Heavy build: the whole WPF dependency closure.
  test-app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # The workspace is on D: (faster than the C: profile drive): packages are restored/extracted there too.
      NUGET_PACKAGES: D:\nuget-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: Directory.Build.targets derives the version from
          # `git rev-list --count --first-parent v2.0.0..HEAD`.
          fetch-depth: 0

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
