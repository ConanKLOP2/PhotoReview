name: CI

on:
  pull_request:
    branches:
      - master
      - refactor/integration
  push:
    branches:
      - master
      - refactor/integration
      - refactor/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-dotnet checks this directory before downloading; if the exact SDK
      # version from global.json is already here, it skips the download entirely.
      # Keyed on global.json's hash so a version bump auto-invalidates the cache
      # instead of silently reusing a stale SDK.
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # No dotnet-version input: reads the pinned SDK version from global.json
        # directly, so the workflow can't drift from what the repo actually pins.

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      - name: Build Release
        run: dotnet build PhotoReview.slnx -c Release --no-restore

      # CI runs HotPath tests only (fast, mocked deps); the 5 projects are independent
      # (no shared state/ports), so they run as parallel background jobs on the runner
      # instead of sequential steps — saves wall-clock time without paying Setup .NET /
      # Restore / Build again per project (that would happen if these were separate
      # GitHub Actions jobs instead of parallel processes within this one job).
      # Stress/Native/Slow/Integration tests run locally only (optional via -Stress, -Native, -Slow, -Integration)
      # NOTE: Filter below is verified to match tools/verify-all.ps1 (TS09 verification)
      - name: Run tests (HotPath, parallel)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = "Category!=Manual&Category!=Stress&Category!=Native&Category!=Slow&Category!=Integration"
          $projects = @(
            'PhotoReview.Architecture.Tests',
            'PhotoReview.Core.Tests',
            'PhotoReview.Imaging.Tests',
            'PhotoReview.Integration.Tests',
            'PhotoReview.App.Tests'
          )

          # Start-Job spawns a separate PowerShell process that does NOT inherit the
          # caller's working directory, so it must be passed in explicitly and set
          # inside the job - otherwise relative project paths below resolve against
          # the job's default directory instead of $GITHUB_WORKSPACE.
          $workDir = $PWD.Path
          $jobs = foreach ($proj in $projects) {
            Start-Job -Name $proj -ScriptBlock {
              param($proj, $filter, $workDir)
              Set-Location $workDir
              dotnet test "tests/$proj/$proj.csproj" -c Release --no-build --filter $filter --logger trx --results-directory "TestResults/$proj" --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none
              exit $LASTEXITCODE
            } -ArgumentList $proj, $filter, $workDir
          }

          $jobs | Wait-Job | Out-Null
          foreach ($job in $jobs) {
            Write-Host "===== $($job.Name) ====="
            Receive-Job -Job $job
            Remove-Job -Job $job
          }

          # Start-Job's own State doesn't reflect dotnet test's exit code reliably,
          # so the pass/fail signal comes from the TRX results instead.
          $failed = $false
          $trxFiles = Get-ChildItem -Path TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue
          if (-not $trxFiles -or $trxFiles.Count -lt $projects.Count) {
            Write-Error "Expected $($projects.Count) TRX result files, found $($trxFiles.Count) - a test run may have crashed before producing results."
            exit 1
          }
          foreach ($trx in $trxFiles) {
            [xml]$xml = Get-Content $trx.FullName
            $counters = $xml.TestRun.ResultSummary.Counters
            if ($xml.TestRun.ResultSummary.outcome -ne 'Completed' -or [int]$counters.failed -gt 0) {
              Write-Error "$($trx.Name): failed=$($counters.failed) outcome=$($xml.TestRun.ResultSummary.outcome)"
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Publish Release
        run: dotnet publish src/PhotoReview.App/PhotoReview.App.csproj -c Release --self-contained false -o src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Verify Release
        shell: powershell
        run: ./tools/verify-release.ps1 -ReleaseDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publish
          path: src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
