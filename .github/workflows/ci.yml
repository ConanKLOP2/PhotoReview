  # Aggregate gate. The job id/name `build-test-publish` is the required status check of master and the check release.yml
  # looks up on the tagged commit, so it stays and now means: build + every test job + publish all succeeded.
  # `if: always()` so it also reports (red) when a needed job failed or was cancelled, instead of being skipped.
  # A docs-only pull request (see `changes`) legitimately skips the jobs; that counts as success.
  build-test-publish:
    needs: [changes, build-publish, compile-gate, test-core, test-app, test-shell, test-shell-settings, test-integration, test-integration-slow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build, tests and publish
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          R_CHANGES: ${{ needs.changes.result }}
          R_BUILD_PUBLISH: ${{ needs.build-publish.result }}
          R_COMPILE_GATE: ${{ needs.compile-gate.result }}
          R_TEST_CORE: ${{ needs.test-core.result }}
          R_TEST_SHELL: ${{ needs.test-shell.result }}
          R_TEST_SHELL_SETTINGS: ${{ needs.test-shell-settings.result }}
          R_TEST_APP: ${{ needs.test-app.result }}
          R_TEST_INTEGRATION_SLOW: ${{ needs.test-integration-slow.result }}
          R_TEST_INTEGRATION: ${{ needs.test-integration.result }}
        run: |
          set -euo pipefail
          fail=0
          check() { # name result expected
            echo "$1: $2 (expected $3)"
            if [ "$2" != "$3" ]; then fail=1; fi
          }
          check changes "${R_CHANGES}" success
          if [ "${CODE}" = "true" ]; then expected=success; else expected=skipped; fi
          check build-publish "${R_BUILD_PUBLISH}" "${expected}"
          check compile-gate "${R_COMPILE_GATE}" "${expected}"
          check test-core "${R_TEST_CORE}" "${expected}"
          check test-shell "${R_TEST_SHELL}" "${expected}"
          check test-shell-settings "${R_TEST_SHELL_SETTINGS}" "${expected}"
          check test-app "${R_TEST_APP}" "${expected}"
          check test-integration-slow "${R_TEST_INTEGRATION_SLOW}" "${expected}"
          check test-integration "${R_TEST_INTEGRATION}" "${expected}"
          if [ "${fail}" -ne 0 ]; then
            echo "::error::build/test/publish did not fully succeed"
            exit 1
          fi

  # NO-WPF (WP-36): the OPTIONAL Native AOT variant of PhotoReview.exe (no WPF bridge; since WP-35 GĐ5 (#500) every secondary
  # window is a Win32 dialog, so Settings/Diagnostics/Recovery open in this build too). A separate artifact, never part of release-publish and never a release gate: continue-on-error, no
