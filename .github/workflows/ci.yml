name: CI

on:
  pull_request:
    branches:
      - master
      - refactor/integration
  push:
    branches:
      - master
      - refactor/integration
      - refactor/**
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      - name: Build Release
        run: dotnet build PhotoReview.slnx -c Release --no-restore

      - name: Run contract tests
        run: dotnet run --project tests/PhotoReview.Tests -c Release --no-build

      - name: Run Architecture tests
        run: dotnet test tests/PhotoReview.Architecture.Tests/PhotoReview.Architecture.Tests.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Run Core tests
        run: dotnet test tests/PhotoReview.Core.Tests/PhotoReview.Core.Tests.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Run Imaging tests
        run: dotnet test tests/PhotoReview.Imaging.Tests/PhotoReview.Imaging.Tests.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Run Integration tests
        run: dotnet test tests/PhotoReview.Integration.Tests/PhotoReview.Integration.Tests.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Run App tests
        run: dotnet test tests/PhotoReview.App.Tests/PhotoReview.App.Tests.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Run remaining unit tests
        run: dotnet test tests/PhotoReview.Tests.Unit/PhotoReview.Tests.Unit.csproj -c Release --no-build --filter "Category!=Manual" --logger trx --results-directory TestResults

      - name: Publish Release
        run: dotnet publish src/PhotoReview.App/PhotoReview.App.csproj -c Release --self-contained false -o src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Verify Release
        shell: powershell
        run: ./tools/verify-release.ps1 -ReleaseDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publish
          path: src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
