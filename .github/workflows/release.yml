name: Release

# Publishes an existing version tag as a GitHub Release with the framework-dependent zip attached.
# Manual only: Actions > Release > Run workflow, enter the tag (CI creates v2.0.N tags after each merge to master).
# Release notes = merged PRs from the previous published release to this tag (explicit previous_tag_name).
# Tests are not re-run here. Instead the first step requires the CI check 'build-test-publish' to have succeeded on the
# tagged commit: CI also backfills tags for commits whose own run was cancelled or failed, so a tag alone proves nothing.
# Override only with the explicit skip_ci_check input (logged as a warning in the step summary).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, e.g. v2.0.93"
        required: true
        type: string
      draft:
        description: "Create as a draft instead of publishing straight away"
        required: true
        type: boolean
        default: false
      skip_ci_check:
        description: "DANGEROUS: release even if CI has not succeeded on the tagged commit"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate tag name
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # [0-9] and \z, not \d and $: in .NET \d also matches non-ASCII digits and $ also matches before a trailing newline.
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z') { throw "Tag '$env:TAG' must look like v2.0.93" }

      - name: Require a green CI check on the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SKIP_CI_CHECK: ${{ inputs.skip_ci_check }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $checkName = 'build-test-publish'
          # The commits endpoint peels annotated tags to the commit.
          $sha = gh api "repos/$repo/commits/$($env:TAG)" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw "Cannot resolve tag $env:TAG to a commit ($LASTEXITCODE)" }
          # filter=all keeps re-runs; --paginate emits one line per check run across all pages.
          $lines = gh api --paginate "repos/$repo/commits/$sha/check-runs?per_page=100&filter=all" --jq '.check_runs[] | [.id, .name, .status, (.conclusion | tostring)] | @tsv'
          if ($LASTEXITCODE -ne 0) { throw "Cannot list check runs of $sha ($LASTEXITCODE)" }
          $runs = @($lines | Where-Object { $_ } | ForEach-Object {
              $f = $_ -split "`t"
              [pscustomobject]@{ Id = [int64]$f[0]; Name = $f[1]; Status = $f[2]; Conclusion = $f[3] }
            } | Where-Object { $_.Name -ceq $checkName })
          # Latest run wins (highest id), so a green re-run overrides an older red or cancelled attempt.
          $latest = $runs | Sort-Object Id -Descending | Select-Object -First 1
          if ($latest -and $latest.Status -eq 'completed' -and $latest.Conclusion -eq 'success') {
            "CI check '$checkName' succeeded on $sha (tag $env:TAG, check run $($latest.Id))." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            return
          }
          $found = if ($latest) { "status=$($latest.Status), conclusion=$($latest.Conclusion)" } else { "no check run named '$checkName' found" }
          $msg = "CI check '$checkName' did not succeed on commit $sha (tag $env:TAG): $found."
          if ($env:SKIP_CI_CHECK -eq 'true') {
            "WARNING: skip_ci_check=true, releasing anyway. $msg" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "::warning::$msg Continuing because skip_ci_check=true."
            return
          }
          throw "$msg Fix CI on that commit (or re-run it), or re-run this workflow with skip_ci_check=true."

      - name: Checkout the tag with full history (the version is derived from git)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Refuse if the release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists; delete it on GitHub first or pick another tag." }
          $global:LASTEXITCODE = 0

      - name: Cache .NET SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\hostedtoolcache\windows\dotnet
          key: ${{ runner.os }}-dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Restore
        run: dotnet restore PhotoReview.slnx

      - name: Publish (framework-dependent)
        run: dotnet publish src/PhotoReview.App/PhotoReview.App.csproj -c Release --no-restore --self-contained false -o src/PhotoReview.App/bin/Release/net10.0-windows/publish

      - name: Verify release folder
        shell: powershell
        run: ./tools/verify-release.ps1 -ReleaseDirectory 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'

      - name: Check the built version matches the tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $v = (Get-Item 'src/PhotoReview.App/bin/Release/net10.0-windows/publish/PhotoReview.App.dll').VersionInfo.ProductVersion
          Write-Host "Built $v for $env:TAG"
          $expected = $env:TAG.TrimStart('v')
          if (-not $v.StartsWith("$expected+")) { throw "Built version '$v' does not match tag '$env:TAG'" }

      - name: Zip and create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          $pub = 'src/PhotoReview.App/bin/Release/net10.0-windows/publish'
          $zip = "PhotoReview-$env:TAG-win-x64.zip"
          Compress-Archive -Path "$pub/*" -DestinationPath $zip
          $sha = (Get-FileHash "$pub/PhotoReview.App.exe" -Algorithm SHA256).Hash
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash
          # Previous release = the highest published (non-draft) release below this tag, so re-releasing an older
          # tag still compares against its real predecessor, not just "the latest one".
          $repo = $env:GITHUB_REPOSITORY
          $thisVer = [version]$env:TAG.TrimStart('v')
          $prev = gh release list --repo $repo --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z' -and [version]$_.TrimStart('v') -lt $thisVer } |
            Sort-Object { [version]$_.TrimStart('v') } -Descending | Select-Object -First 1
          $changes = "This is the first published release; no earlier release to compare with."
          if ($prev) {
            # Explicit previous_tag_name: the summary is exactly $prev..$env:TAG (merged PRs + full-changelog link).
            $body = gh api "repos/$repo/releases/generate-notes" -f tag_name=$env:TAG -f previous_tag_name=$prev --jq .body
            if ($LASTEXITCODE -ne 0) { throw "generate-notes failed ($LASTEXITCODE)" }
            $changes = "## Changes since $prev`n`n$body"
          }
          $notes = @"
          Requires Windows 10/11 x64 and the **.NET 10 Windows Desktop Runtime**. Unzip and run ``PhotoReview.App.exe``.

          SHA256 of ``$zip``: ``$zipSha``
          SHA256 of ``PhotoReview.App.exe``: ``$sha``

          $changes
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $ghArgs = @('release', 'create', $env:TAG, $zip, '--title', "PhotoReview $($env:TAG.TrimStart('v'))",
                    '--verify-tag', '--notes-file', 'release-notes.md')
          if ($env:DRAFT -eq 'true') { $ghArgs += '--draft' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          "Release $env:TAG created (draft=$env:DRAFT, changes since $prev), zip $zip (SHA256 $zipSha), exe SHA256 $sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
