name: ciflake-diag

# TEMPORARY (fix/shell-integration-ci-cascade): chạy riêng Shell.Integration.Tests nhiều lượt trên runner CI để chụp stack của lần treo.
# Xoá trước khi merge.
on:
  push:
    branches:
      - fix/shell-integration-ci-cascade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Fetch native binaries
        shell: powershell
        run: ./tools/fetch-native.ps1

      - name: Fetch LibRaw native binary
        shell: powershell
        run: ./tools/fetch-libraw.ps1

      - name: Build
        run: dotnet build tests/PhotoReview.Shell.Integration.Tests/PhotoReview.Shell.Integration.Tests.csproj -c Release

      - name: Environment
        shell: pwsh
        continue-on-error: true
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-List
          Get-Process -Name explorer, dwm -ErrorAction SilentlyContinue | Select-Object Name, Id, SessionId | Format-Table
          [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          query session 2>&1

      - name: Install dotnet-stack
        run: dotnet tool install --global dotnet-stack

      - name: Run Shell Integration tests (1 pass)
        shell: pwsh
        timeout-minutes: 9
        continue-on-error: true
        env:
          TEST_FILTER: "Category!=Manual&Category!=Native&Category!=Slow"
        run: |
          $env:PHOTOREVIEW_DOTNET_STACK = (Get-Command dotnet-stack).Source
          foreach ($i in 1..1) {
            "=== pass $i"
            dotnet test tests/PhotoReview.Shell.Integration.Tests/PhotoReview.Shell.Integration.Tests.csproj -c Release --no-build --filter "$env:TEST_FILTER" --blame-hang --blame-hang-timeout 300s --blame-hang-dump-type none
          }
